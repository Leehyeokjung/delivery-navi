<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>길안내 여는 중</title>
<!-- 배송 경로 길안내 징검다리(GitHub Pages). 인쇄 종이 QR·휴대폰 경로 파일의 링크가 여기로 온다:
     index.html#k/위도/경도/번호 (k = 카카오내비, t = TMAP).
     인쇄 종이 맨 위 QR 은 번호 버튼 목록: index.html#L/<앱 k·t·m>/<묶음>/… (묶음 = [a:|p:]번호[w].위도차.경도차,… —
     1/100000도 정수, 앞 집과의 차이, w = 걸어서 가는 집, a/p = 오전/오후, 그 밖 = 사람 이름(가·나)). 버튼을 누르면 그 집 길안내.
     주소(2026-10-03 사용자): 위치로 카카오 지도에 물어 버튼 아래·길안내 목적지 이름에 씀(동·호수는 배송표에서).
     카카오 지도 JavaScript API services.Geocoder.coord2Address(x = 경도, y = 위도, callback) → result[0].road_address.address_name
     (없으면 result[0].address.address_name), status = kakao.maps.services.Status.OK (apis.map.kakao.com/web/documentation, 확인 2026-10-03).
     못 찾으면 "11번 배송지".
     인쇄 종이 맨 위 QR(2026-10-03 사용자: 휴대폰 경로 파일처럼 이름·식수·비고·다 했어요): index.html#P/<앱>/<글>,
     글 = base64url(raw deflate(첫 줄 제목, '#이름' 묶음, 집마다 '번호[w]|위도차|경도차|이름|식수|비고')) — navlink.card_urls.
     # 뒤라 서버로 가지 않고, 이 페이지는 아무것도 저장하지 않는다(다 했어요 표시만 이 휴대폰 저장소에). # 뒤는 서버로 가지 않아 집 위치가 GitHub 에 남지 않는다.
     이 페이지에는 주소·이름이 없다. 키는 config.js(scripts/publish_navi.py 가 .env 에서 채움).
     카카오: JavaScript SDK 2.8.3 + Kakao.Navi.start (developers.kakao.com/docs/ko/kakaonavi/js, 확인 2026-09-26, integrity 는 공식 다운로드 페이지 값)
     TMAP: apis.openapi.sk.com/tmap/app/routes?appKey&name&lon&lat — 지금 공식 문서에서 빠진 링크, 휴대폰 시험 필요 -->
<style>
  :root { color-scheme: light dark; --ink: #16212C; --bg: #F1F4F6; --card: #fff; --line: #D5DDE4; --muted: #5B6B7A; }
  @media (prefers-color-scheme: dark) { :root { --ink: #E6EDF3; --bg: #0F151B; --card: #18212A; --line: #2B3845; --muted: #9BAAB8; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  *, *::before, *::after { box-sizing: border-box; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 12px; }
  h1 { font-size: 24px; margin: 0; } p { margin: 0; color: var(--muted); }
  a.btn { display: block; text-align: center; padding: 16px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
  a.btn.main { background: #1E6FD9; border-color: #1E6FD9; color: #fff; }
  small { color: var(--muted); font-size: 13px; }
  /* 번호 버튼(운전 중에도 잘 보이게, 종이 순서 칸과 같은 색: 주황 = 차 세우는 집, 하늘색 = 걸어서) */
  h2 { font-size: 20px; margin: 8px 0 0; }
  /* 카드 화면(#P) — 휴대폰 경로 파일(phoneview)과 같은 모양 */
  body.cards main { max-width: 560px; padding: 0 0 40px; gap: 0; display: block; }
  .head { padding: 14px 16px 8px; } .head h1 { font-size: 22px; } .head p { font-size: 14px; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 3px solid #F2B705; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  .bar b { flex: 1; font-size: 17px; } .bar b small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  body.cards h2 { margin: 18px 16px 6px; color: var(--muted); font-size: 17px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 8px 16px; padding: 12px 14px; }
  .card.next { border: 3px solid #F2B705; padding: 10px 12px; }
  .card.done { opacity: .55; } .card.done .body { display: none; }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .no { flex: none; min-width: 44px; height: 44px; padding: 0 6px; border-radius: 22px; background: #FFB000; color: #111; display: grid; place-items: center; font-weight: 800; font-size: 19px; }
  .card.done .no { background: #9AA6B2; }
  .addr { font-weight: 700; font-size: 19px; } .meta { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .walk { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 16px; } .walk span { color: var(--muted); font-size: 14px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns a, .btns button, .bar a { flex: 1; display: block; text-align: center; border-radius: 10px; padding: 12px 8px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btns a, .bar a { background: #1E6FD9; color: #fff; border: 0; } .bar a { flex: none; padding: 10px 14px; }
  .btns button { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid button small { display: block; font: 600 12px/1.25 sans-serif; margin-top: 6px; color: inherit; word-break: keep-all; }
  .grid button { font: 800 30px/1 sans-serif; padding: 14px 4px; border-radius: 14px; border: 3px solid #B37A00; background: #FFB000; color: #111; }
  .grid button.walk { background: #BDD7EE; border-color: #5B8DB8; }
  .grid button.done { background: #C9CED3; border-color: #9AA2AA; color: #555; text-decoration: line-through; }
  .grid button.next { outline: 6px solid #12A150; outline-offset: 2px; }
  #nextbar { display: block; text-align: center; font: 800 26px/1.2 sans-serif; padding: 18px; border-radius: 14px; border: 0; background: #12A150; color: #fff; }
</style>
<script src="config.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js" integrity="sha384-oroumrnFVE0xtgqyDZJARgERibXg2C28380uaUZz2kHDS5CR7tu20eGiOU6GkTpy" crossorigin="anonymous"></script>
</head>
<body>
<main>
  <h1 id="title">길안내를 여는 중…</h1>
  <p id="desc">앱이 열리지 않으면 아래 버튼을 누르세요.</p>
  <a class="btn" id="kn" href="#" hidden>🧭 카카오내비로 길안내</a>
  <a class="btn" id="tm" href="#" hidden>🧭 TMAP으로 길안내</a>
  <a class="btn" id="km" href="#" hidden>🗺 카카오맵으로 길찾기</a>
  <small>이 페이지는 주소를 저장하지 않아요.</small>
</main>
<script>
"use strict";
const cfg = window.NAVI || {};
const parts = decodeURIComponent(location.hash.slice(1)).split("/");
const [app, lat, lng, no] = parts;
const num = v => /^-?\d{1,3}\.\d+$/.test(v || "");
const $ = id => document.getElementById(id);
let kakaoOk = null;
const kakaoReady = () => {
  if (kakaoOk === null) {
    kakaoOk = false;
    if (cfg.kakaoKey && window.Kakao) {
      try { if (!Kakao.isInitialized()) Kakao.init(cfg.kakaoKey); kakaoOk = Kakao.isInitialized(); } catch (e) { kakaoOk = false; }
    }
  }
  return kakaoOk;
};
// 위치 → 주소(카카오 지도 coord2Address). 키·지도 API 가 없거나 못 찾으면 "" (그때는 "N번 배송지")
let mapsReady = null;
const loadMaps = () => {
  if (mapsReady) return mapsReady;
  mapsReady = new Promise(ok => {
    if (!cfg.kakaoKey) return ok(false);
    const sc = document.createElement("script");
    sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(cfg.kakaoKey)}&libraries=services&autoload=false`;
    sc.onload = () => { try { kakao.maps.load(() => ok(true)); } catch (e) { ok(false); } };
    sc.onerror = () => ok(false);
    document.head.appendChild(sc);
  });
  return mapsReady;
};
const short = a => (a || "").split(" ").slice(2).join(" ") || a || "";      // "경기 연천군 전곡읍 …" → "전곡읍 …"
const addrOf = (la, ln) => loadMaps().then(ready => new Promise(ok => {
  if (!ready) return ok("");
  try {
    new kakao.maps.services.Geocoder().coord2Address(Number(ln), Number(la), (result, status) => {
      if (status !== kakao.maps.services.Status.OK || !result.length) return ok("");
      const r = result[0];
      ok(short(r.road_address ? r.road_address.address_name : r.address ? r.address.address_name : ""));
    });
  } catch (e) { ok(""); }
}));
const within = (p, ms) => Promise.race([p, new Promise(ok => setTimeout(() => ok(""), ms))]);
// 그 집으로 고른 앱 길안내(앱이 준비 안 됐으면 카카오맵)
const go = (code, name, la, ln) => {
  if (code === "k" && kakaoReady()) return Kakao.Navi.start({ name, x: Number(ln), y: Number(la), coordType: "wgs84" });
  if (code === "t" && cfg.tmapKey) {
    location.href = `https://apis.openapi.sk.com/tmap/app/routes?appKey=${encodeURIComponent(cfg.tmapKey)}&name=${encodeURIComponent(name)}&lon=${ln}&lat=${la}`;
    return;
  }
  location.href = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${la},${ln}`;
};
const esc = t => String(t || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function unpack(b64) {
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(stream).text();
}
if (app === "P") {
  // 카드 화면: 휴대폰 경로 파일처럼 집마다 카드(번호·주소·이름·식수·비고, 걸어서 가는 집은 카드 안), 길안내·다 했어요
  const code = parts[1];
  const raw = location.hash.slice(1).split("/").slice(2).join("/");
  document.body.classList.add("cards");
  const main = document.querySelector("main");
  main.innerHTML = '<p style="padding:16px">여는 중…</p>';
  unpack(raw).then(text => {
    const lines = text.split("\n");
    const title = lines.shift();
    let la = 0, ln = 0, group = "", card = null;
    const cards = [];
    for (const line of lines) {
      if (line.startsWith("#")) { group = line.slice(1); cards.push({ head: group }); continue; }
      const [nw, dla, dln, name, meal, note] = line.split("|");
      la += Number(dla); ln += Number(dln);
      const stop = { no: nw.replace("w", ""), walk: nw.endsWith("w"), la: (la / 1e5).toFixed(5), ln: (ln / 1e5).toFixed(5),
                     meta: [name, meal, note].filter(Boolean).join(" · ") };
      if (stop.walk && card) card.walks.push(stop);
      else { card = { id: group + stop.no, group, stop, walks: [] }; cards.push(card); }
    }
    const real = cards.filter(c => !c.head);
    const key = "navi.cards:" + title;
    let done = new Set();
    try { done = new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch (e) { done = new Set(); }
    main.innerHTML = `<div class="head"><h1>${esc(title)}</h1><p>차 세우는 곳 ${real.length}곳 · 끝낸 곳 <b id="count"></b></p></div>`
      + '<div class="bar" id="next"></div>';
    for (const c of cards) {
      if (c.head) { main.insertAdjacentHTML("beforeend", `<h2>${esc(c.head)}</h2>`); continue; }
      const no = c.stop.no + (c.walks.length ? "~" + c.walks[c.walks.length - 1].no : "");
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="top"><div class="no">${esc(no)}</div><div><div class="addr">${esc(c.stop.no)}번 배송지</div>`
        + `<div class="meta">${esc(c.stop.meta)}</div></div></div><div class="body">`
        + c.walks.map(w => `<div class="walk">🚶 <b>${esc(w.no)}번</b> <span class="waddr"></span> <span>${esc(w.meta)}</span></div>`).join("")
        + '<div class="btns"><a href="#" class="go">🧭 길안내</a><button type="button" class="ok"></button></div></div>';
      main.appendChild(el);
      c.el = el; c.no = no;
      el.querySelector("a.go").addEventListener("click", e => { e.preventDefault(); go(code, c.addr || `${c.stop.no}번 배송지`, c.stop.la, c.stop.ln); });
      el.querySelector("button.ok").addEventListener("click", () => {
        done.has(c.id) ? done.delete(c.id) : done.add(c.id);
        try { localStorage.setItem(key, JSON.stringify([...done])); } catch (e) { /* 기억 못 해도 화면은 됨 */ }
        paint();
      });
    }
    main.insertAdjacentHTML("beforeend", '<p style="padding:16px;font-size:13px;color:var(--muted)">🧭 길안내를 누르면 앱이 열려요. 🚶 는 차를 세워 두고 걸어서 가는 집이에요. 동·호수는 종이를 봐 주세요. 이 페이지는 아무것도 저장하지 않아요.</p>');
    function paint() {
      let next = null;
      for (const c of real) {
        const d = done.has(c.id);
        c.el.classList.toggle("done", d);
        c.el.querySelector("button.ok").textContent = d ? "↺ 되돌리기" : "✔ 다 했어요";
        c.el.classList.remove("next");
        if (!d && !next) next = c;
      }
      const bar = $("next");
      bar.innerHTML = "";
      if (next) {
        next.el.classList.add("next");
        bar.innerHTML = `<b>다음: ${esc(next.group ? next.group + " " : "")}${esc(next.no)}번<small>${esc(next.addr || "")}</small></b>`;
        const a = document.createElement("a");
        a.href = "#"; a.textContent = "🧭 길안내";
        a.addEventListener("click", e => { e.preventDefault(); go(code, next.addr || `${next.stop.no}번 배송지`, next.stop.la, next.stop.ln); });
        bar.appendChild(a);
      } else bar.innerHTML = "<b>오늘 배송을 모두 마쳤어요 👍</b>";
      $("count").textContent = `${done.size} / ${real.length}`;
    }
    paint();
    // 주소: 위치로 카카오 지도에 하나씩 물어 카드에 채운다(동·호수는 종이에서)
    (async () => {
      for (const c of real) {
        c.addr = await within(addrOf(c.stop.la, c.stop.ln), 4000);
        if (c.addr) c.el.querySelector(".addr").textContent = c.addr;
        for (const [k, w] of c.walks.entries()) {
          const a = await within(addrOf(w.la, w.ln), 4000);
          c.el.querySelectorAll(".waddr")[k].textContent = a;
        }
        paint();
      }
    })();
  }).catch(() => {
    main.innerHTML = '<p style="padding:16px">QR 내용을 읽지 못했어요. 종이의 QR을 다시 찍어 주세요. (휴대폰 인터넷 앱이 너무 오래되었으면 업데이트가 필요해요)</p>';
  });
} else if (app === "L") {
  // 번호 버튼 목록(인쇄 종이 맨 위 QR)
  const code = parts[1];
  const key = "navi:" + location.hash;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { done = {}; }
  const save = () => { try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) { /* 저장 안 돼도 버튼은 됨 */ } };
  const main = document.querySelector("main");
  main.innerHTML = '<h1>번호를 누르면 길안내</h1><p>종이의 순서 번호와 같아요. 주황 = 차 세우는 집, 하늘색 = 걸어서.</p><button id="nextbar" type="button"></button>';
  let la = 0, ln = 0, ok = true;
  const all = [];
  for (const g of parts.slice(2)) {
    const m = /^(?:([^:,.]{1,6}):)?(.*)$/.exec(g);
    const glabel = !m[1] ? "" : m[1] === "a" ? "오전" : m[1] === "p" ? "오후" : m[1];
    if (m[1]) {
      const h = document.createElement("h2");
      h.textContent = glabel;
      main.appendChild(h);
    }
    const grid = document.createElement("div");
    grid.className = "grid";
    main.appendChild(grid);
    for (const it of m[2].split(",")) {
      const f = /^(\d{1,3})(w?)\.(-?\d+)\.(-?\d+)$/.exec(it);
      if (!f) { ok = false; continue; }
      la += Number(f[3]); ln += Number(f[4]);
      const id = (m[1] || "") + f[1];
      const stop = { id, group: glabel, no: f[1], walk: !!f[2], la: (la / 1e5).toFixed(5), ln: (ln / 1e5).toFixed(5) };
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = f[1];
      stop.small = document.createElement("small");
      b.appendChild(stop.small);
      if (stop.walk) b.classList.add("walk");
      b.addEventListener("click", () => open(stop));
      grid.appendChild(b);
      stop.btn = b;
      all.push(stop);
    }
  }
  const paint = () => {
    const nx = all.find(s => !done[s.id]);
    for (const s of all) { s.btn.classList.toggle("done", !!done[s.id]); s.btn.classList.toggle("next", s === nx); }
    const bar = $("nextbar");
    bar.textContent = nx ? `다음: ${nx.group ? nx.group + " " : ""}${nx.no}번 길안내 ▶` : "모두 끝났어요 ✔";
    bar.onclick = nx ? () => open(nx) : null;
  };
  // 누른 집은 회색(끝낸 것으로). 잘못 누른 회색 버튼을 다시 누르면 그 집 길안내를 다시 열고 그대로 회색
  function open(s) { done[s.id] = 1; save(); paint(); go(code, s.addr || `${s.no}번 배송지`, s.la, s.ln); }
  // 버튼 아래 주소: 하나씩 차례로 물어본다(한꺼번에 몰리지 않게)
  (async () => {
    for (const s of all) {
      s.addr = await within(addrOf(s.la, s.ln), 4000);
      s.small.textContent = s.addr;
    }
  })();
  if (!all.length || !ok) main.insertAdjacentHTML("beforeend", "<p>일부 번호를 읽지 못했어요. 종이의 QR을 다시 찍어 주세요.</p>");
  main.insertAdjacentHTML("beforeend", '<small>이 페이지는 주소를 저장하지 않아요. 누른 번호는 이 휴대폰에만 표시돼요.</small>');
  paint();
} else if (!num(lat) || !num(lng)) {
  $("title").textContent = "길안내 주소가 잘못됐어요";
  $("desc").textContent = "종이의 QR을 다시 찍거나 경로 파일의 버튼을 다시 눌러 주세요.";
} else {
  // 집 하나(휴대폰 경로 파일의 길안내 버튼): 주소를 잠깐(최대 1.5초) 찾아본 뒤 그 이름으로 연다
  const no_name = `${/^\d{1,3}$/.test(no || "") ? no + "번 " : ""}배송지`;
  $("title").textContent = `${no_name} 길안내`;
  within(addrOf(lat, lng), 1500).then(addr => {
    const name = addr || no_name;
    if (addr) $("title").textContent = `${addr} 길안내`;
    const km = $("km");
    km.href = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`;
    km.hidden = false;
    const ready = kakaoReady();
    const startKakao = () => Kakao.Navi.start({ name, x: Number(lng), y: Number(lat), coordType: "wgs84" });
    if (ready) {
      const kn = $("kn"); kn.hidden = false;
      kn.addEventListener("click", e => { e.preventDefault(); startKakao(); });
    }
    if (cfg.tmapKey) {
      const tm = $("tm"); tm.hidden = false;
      tm.href = `https://apis.openapi.sk.com/tmap/app/routes?appKey=${encodeURIComponent(cfg.tmapKey)}&name=${encodeURIComponent(name)}&lon=${lng}&lat=${lat}`;
    }
    const first = app === "k" && ready ? $("kn") : app === "t" && cfg.tmapKey ? $("tm") : km;
    first.classList.add("main");
    first.parentNode.insertBefore(first, $("kn"));
    // 바로 열기(막히는 휴대폰이면 사용자가 버튼을 누름)
    setTimeout(() => { if (first === $("kn")) startKakao(); else location.href = first.href; }, 300);
  });
}
</script>
</body>
</html>
