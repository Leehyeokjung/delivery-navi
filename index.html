<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>길안내 여는 중</title>
<!-- 배송 경로 길안내 징검다리(GitHub Pages). 인쇄 종이 QR·휴대폰 경로 파일의 링크가 여기로 온다:
     index.html#k/위도/경도/번호 (k = 카카오내비, t = TMAP).
     인쇄 종이 맨 위 QR 은 번호 버튼 목록: index.html#L/<앱 k·t·m>/<묶음>/… (묶음 = [a:|p:]번호[w].위도차.경도차,… —
     1/100000도 정수, 앞 집과의 차이, w = 걸어서 가는 집, a/p = 오전/오후). 버튼을 누르면 그 집 길안내. # 뒤는 서버로 가지 않아 집 위치가 GitHub 에 남지 않는다.
     이 페이지에는 주소·이름이 없다. 키는 config.js(scripts/publish_navi.py 가 .env 에서 채움).
     카카오: JavaScript SDK 2.8.3 + Kakao.Navi.start (developers.kakao.com/docs/ko/kakaonavi/js, 확인 2026-09-26, integrity 는 공식 다운로드 페이지 값)
     TMAP: apis.openapi.sk.com/tmap/app/routes?appKey&name&lon&lat — 지금 공식 문서에서 빠진 링크, 휴대폰 시험 필요 -->
<style>
  :root { color-scheme: light dark; --ink: #16212C; --bg: #F1F4F6; --card: #fff; --line: #D5DDE4; --muted: #5B6B7A; }
  @media (prefers-color-scheme: dark) { :root { --ink: #E6EDF3; --bg: #0F151B; --card: #18212A; --line: #2B3845; --muted: #9BAAB8; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  *, *::before, *::after { box-sizing: border-box; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 12px; }
  h1 { font-size: 24px; margin: 0; } p { margin: 0; color: var(--muted); }
  a.btn { display: block; text-align: center; padding: 16px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
  a.btn.main { background: #1E6FD9; border-color: #1E6FD9; color: #fff; }
  small { color: var(--muted); font-size: 13px; }
  /* 번호 버튼(운전 중에도 잘 보이게, 종이 순서 칸과 같은 색: 주황 = 차 세우는 집, 하늘색 = 걸어서) */
  h2 { font-size: 20px; margin: 8px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid button { font: 800 30px/1 sans-serif; padding: 20px 0; border-radius: 14px; border: 3px solid #B37A00; background: #FFB000; color: #111; }
  .grid button.walk { background: #BDD7EE; border-color: #5B8DB8; }
  .grid button.done { background: #C9CED3; border-color: #9AA2AA; color: #555; text-decoration: line-through; }
  .grid button.next { outline: 6px solid #12A150; outline-offset: 2px; }
  #nextbar { display: block; text-align: center; font: 800 26px/1.2 sans-serif; padding: 18px; border-radius: 14px; border: 0; background: #12A150; color: #fff; }
</style>
<script src="config.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js" integrity="sha384-oroumrnFVE0xtgqyDZJARgERibXg2C28380uaUZz2kHDS5CR7tu20eGiOU6GkTpy" crossorigin="anonymous"></script>
</head>
<body>
<main>
  <h1 id="title">길안내를 여는 중…</h1>
  <p id="desc">앱이 열리지 않으면 아래 버튼을 누르세요.</p>
  <a class="btn" id="kn" href="#" hidden>🧭 카카오내비로 길안내</a>
  <a class="btn" id="tm" href="#" hidden>🧭 TMAP으로 길안내</a>
  <a class="btn" id="km" href="#" hidden>🗺 카카오맵으로 길찾기</a>
  <small>이 페이지는 주소를 저장하지 않아요.</small>
</main>
<script>
"use strict";
const cfg = window.NAVI || {};
const parts = decodeURIComponent(location.hash.slice(1)).split("/");
const [app, lat, lng, no] = parts;
const num = v => /^-?\d{1,3}\.\d+$/.test(v || "");
const $ = id => document.getElementById(id);
let kakaoOk = null;
const kakaoReady = () => {
  if (kakaoOk === null) {
    kakaoOk = false;
    if (cfg.kakaoKey && window.Kakao) {
      try { if (!Kakao.isInitialized()) Kakao.init(cfg.kakaoKey); kakaoOk = Kakao.isInitialized(); } catch (e) { kakaoOk = false; }
    }
  }
  return kakaoOk;
};
// 그 집으로 고른 앱 길안내(앱이 준비 안 됐으면 카카오맵)
const go = (code, name, la, ln) => {
  if (code === "k" && kakaoReady()) return Kakao.Navi.start({ name, x: Number(ln), y: Number(la), coordType: "wgs84" });
  if (code === "t" && cfg.tmapKey) {
    location.href = `https://apis.openapi.sk.com/tmap/app/routes?appKey=${encodeURIComponent(cfg.tmapKey)}&name=${encodeURIComponent(name)}&lon=${ln}&lat=${la}`;
    return;
  }
  location.href = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${la},${ln}`;
};
if (app === "L") {
  // 번호 버튼 목록(인쇄 종이 맨 위 QR)
  const code = parts[1];
  const key = "navi:" + location.hash;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { done = {}; }
  const save = () => { try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) { /* 저장 안 돼도 버튼은 됨 */ } };
  const main = document.querySelector("main");
  main.innerHTML = '<h1>번호를 누르면 길안내</h1><p>종이의 순서 번호와 같아요. 주황 = 차 세우는 집, 하늘색 = 걸어서.</p><button id="nextbar" type="button"></button>';
  let la = 0, ln = 0, ok = true;
  const all = [];
  for (const g of parts.slice(2)) {
    const m = /^(?:([ap]):)?(.*)$/.exec(g);
    if (m[1]) main.insertAdjacentHTML("beforeend", `<h2>${m[1] === "a" ? "오전" : "오후"}</h2>`);
    const grid = document.createElement("div");
    grid.className = "grid";
    main.appendChild(grid);
    for (const it of m[2].split(",")) {
      const f = /^(\d{1,3})(w?)\.(-?\d+)\.(-?\d+)$/.exec(it);
      if (!f) { ok = false; continue; }
      la += Number(f[3]); ln += Number(f[4]);
      const id = (m[1] || "") + f[1];
      const stop = { id, no: f[1], walk: !!f[2], la: (la / 1e5).toFixed(5), ln: (ln / 1e5).toFixed(5) };
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = f[1];
      if (stop.walk) b.classList.add("walk");
      b.addEventListener("click", () => open(stop));
      grid.appendChild(b);
      stop.btn = b;
      all.push(stop);
    }
  }
  const paint = () => {
    const nx = all.find(s => !done[s.id]);
    for (const s of all) { s.btn.classList.toggle("done", !!done[s.id]); s.btn.classList.toggle("next", s === nx); }
    const bar = $("nextbar");
    bar.textContent = nx ? `다음: ${nx.no}번 길안내 ▶` : "모두 끝났어요 ✔";
    bar.onclick = nx ? () => open(nx) : null;
  };
  // 누른 집은 회색(끝낸 것으로). 잘못 누른 회색 버튼을 다시 누르면 그 집 길안내를 다시 열고 그대로 회색
  function open(s) { done[s.id] = 1; save(); paint(); go(code, `${s.no}번 배송지`, s.la, s.ln); }
  if (!all.length || !ok) main.insertAdjacentHTML("beforeend", "<p>일부 번호를 읽지 못했어요. 종이의 QR을 다시 찍어 주세요.</p>");
  main.insertAdjacentHTML("beforeend", '<small>이 페이지는 주소를 저장하지 않아요. 누른 번호는 이 휴대폰에만 표시돼요.</small>');
  paint();
} else if (!num(lat) || !num(lng)) {
  $("title").textContent = "길안내 주소가 잘못됐어요";
  $("desc").textContent = "종이의 QR을 다시 찍거나 경로 파일의 버튼을 다시 눌러 주세요.";
} else {
  const name = `${/^\d{1,3}$/.test(no || "") ? no + "번 " : ""}배송지`;
  $("title").textContent = `${name} 길안내`;
  const km = $("km");
  km.href = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`;
  km.hidden = false;
  const ready = kakaoReady();
  const startKakao = () => Kakao.Navi.start({ name, x: Number(lng), y: Number(lat), coordType: "wgs84" });
  if (ready) {
    const kn = $("kn"); kn.hidden = false;
    kn.addEventListener("click", e => { e.preventDefault(); startKakao(); });
  }
  if (cfg.tmapKey) {
    const tm = $("tm"); tm.hidden = false;
    tm.href = `https://apis.openapi.sk.com/tmap/app/routes?appKey=${encodeURIComponent(cfg.tmapKey)}&name=${encodeURIComponent(name)}&lon=${lng}&lat=${lat}`;
  }
  const first = app === "k" && ready ? $("kn") : app === "t" && cfg.tmapKey ? $("tm") : km;
  first.classList.add("main");
  first.parentNode.insertBefore(first, $("kn"));
  // 바로 열기(막히는 휴대폰이면 사용자가 버튼을 누름)
  setTimeout(() => { if (first === $("kn")) startKakao(); else location.href = first.href; }, 300);
}
</script>
</body>
</html>
